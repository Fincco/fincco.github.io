<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Cipher Terminal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --error: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card h2 {
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, textarea {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 0.95rem;
      outline: none;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .output-box {
      background-color: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      min-height: 48px;
      word-break: break-all;
      font-family: monospace;
      position: relative;
    }

    .error {
      color: var(--error);
    }

    .info-badge {
      font-size: 0.75rem;
      background-color: #334155;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Secret Cipher Terminal</h1>
      <p>Prefix: <code>si</code> | Hidden Symbol: <code>‎‎‎‎‎</code></p>
    </header>

    <!-- ENCODER -->
    <div class="card">
      <h2>Encoder</h2>
      <div class="control-group">
        <label for="encodeMode">Cipher Mode</label>
        <select id="encodeMode">
          <option value="visible">Visible Cipher (Alien Glyphs: ⬡ / ⬢)</option>
          <option value="invisible">Steganographic (Zero-Width Invisible)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="plainText">Plaintext Message</label>
        <textarea id="plainText" placeholder="Type your secret message here..."></textarea>
      </div>
      <div class="btn-group">
        <button onclick="handleEncode()">Encode Message</button>
        <button onclick="copyOutput('encodedOutput')">Copy Secret Message</button>
      </div>
      <div class="control-group">
        <label>Encoded Output <span id="modeBadge" class="info-badge">Visible Glyphs</span></label>
        <div id="encodedOutput" class="output-box">si</div>
      </div>
    </div>

    <!-- DECODER -->
    <div class="card">
      <h2>Decoder</h2>
      <div class="control-group">
        <label for="cipherText">Encoded Message</label>
        <textarea id="cipherText" placeholder="Paste encoded message starting with 'si'..."></textarea>
      </div>
      <div class="btn-group">
        <button onclick="handleDecode()">Decode Message</button>
      </div>
      <div class="control-group">
        <label>Decoded Plaintext</label>
        <div id="decodedOutput" class="output-box"></div>
      </div>
    </div>
  </div>

  <script>
    const PREFIX = "si";
    const SECRET_SYMBOL = " ‎‎‎‎‎"; 

    // Invisible Payload Markers (distinct from the secret symbol)
    const INV_BIT_0 = "\u200b"; // Zero-Width Space
    const INV_BIT_1 = "\u200c"; // Zero-Width Non-Joiner

    // Visible Cipher Markers
    const VIS_BIT_0 = "⬡"; 
    const VIS_BIT_1 = "⬢"; 

    document.getElementById("encodeMode").addEventListener("change", (e) => {
      const badge = document.getElementById("modeBadge");
      badge.textContent = e.target.value === "visible" ? "Visible Glyphs" : "Invisible payload embedded";
    });

    function handleEncode() {
      const text = document.getElementById("plainText").value;
      const mode = document.getElementById("encodeMode").value;
      const outputEl = document.getElementById("encodedOutput");

      if (!text) {
        outputEl.textContent = PREFIX + SECRET_SYMBOL;
        return;
      }

      const bit0 = (mode === "visible") ? VIS_BIT_0 : INV_BIT_0;
      const bit1 = (mode === "visible") ? VIS_BIT_1 : INV_BIT_1;

      // Convert UTF-8 text into binary bit stream
      const bytes = new TextEncoder().encode(text);
      let payloadBits = "";

      for (let byte of bytes) {
        const bits = byte.toString(2).padStart(8, '0');
        for (let bit of bits) {
          payloadBits += (bit === '1' ? bit1 : bit0);
        }
      }

      // Format: PREFIX + Bit Payload + Required Symbol Suffix
      outputEl.textContent = PREFIX + payloadBits + SECRET_SYMBOL;
    }

    function handleDecode() {
      const input = document.getElementById("cipherText").value;
      const outputEl = document.getElementById("decodedOutput");

      outputEl.classList.remove("error");

      if (!input.startsWith(PREFIX)) {
        outputEl.textContent = "Error: Invalid message format. Must start with 'si'.";
        outputEl.classList.add("error");
        return;
      }

      // Strip "si" prefix
      const payload = input.slice(PREFIX.length);
      let bitString = "";

      // Extract binary bits, ignoring the secret symbol suffix and filler characters
      for (let char of payload) {
        if (char === INV_BIT_1 || char === VIS_BIT_1) {
          bitString += "1";
        } else if (char === INV_BIT_0 || char === VIS_BIT_0) {
          bitString += "0";
        }
      }

      if (bitString.length === 0) {
        outputEl.textContent = "Error: No secret payload found in the message.";
        outputEl.classList.add("error");
        return;
      }

      if (bitString.length % 8 !== 0) {
        outputEl.textContent = "Error: Message is corrupted or truncated.";
        outputEl.classList.add("error");
        return;
      }

      // Reconstruct original UTF-8 string
      try {
        const bytes = new Uint8Array(bitString.length / 8);
        for (let i = 0; i < bitString.length; i += 8) {
          bytes[i / 8] = parseInt(bitString.slice(i, i + 8), 2);
        }
        outputEl.textContent = new TextDecoder().decode(bytes);
      } catch (err) {
        outputEl.textContent = "Error: Failed to decode payload.";
        outputEl.classList.add("error");
      }
    }

    function copyOutput(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Secret message copied to clipboard!");
      });
    }
  </script>
</body>
</html>
