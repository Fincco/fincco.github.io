<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Cipher Terminal</title>
  <!-- QRCode.js Library for optional QR generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --error: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card h2 {
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
    }

    .checkbox-group input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, textarea, input[type="password"] {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 0.95rem;
      outline: none;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    select:focus, textarea:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .output-box {
      background-color: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      min-height: 48px;
      word-break: break-all;
      font-family: monospace;
      position: relative;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 1rem;
      background-color: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    #qrcode {
      padding: 10px;
      background: white;
      border-radius: 6px;
    }

    .error {
      color: var(--error);
    }

    .info-badge {
      font-size: 0.75rem;
      background-color: #334155;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Secret Cipher Terminal</h1>
      <p>Prefix: <code>si</code> | Hidden Symbol: <code>‎‎‎‎‎</code></p>
    </header>

    <!-- ENCODER -->
    <div class="card">
      <h2>Encoder</h2>
      <div class="control-group">
        <label for="encodeMode">Cipher Mode</label>
        <select id="encodeMode">
          <option value="visible">Alien Glyphs (⬡ / ⬢)</option>
          <option value="lunar">Lunar Phases (🌑 / 🌕)</option>
          <option value="matrix">Cyber Blocks (░ / ▓)</option>
          <option value="runic">Runic Magic (ᚢ / ᛏ)</option>
          <option value="cards">Card Suits (♢ / ♦)</option>
          <option value="music">Music Notes (♩ / ♬)</option>
          <option value="zodiac">Zodiac Signs (♈ / ♏)</option>
          <option value="invisible">Steganographic (Zero-Width Invisible)</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="usePassword" onchange="togglePasswordFields()" />
        <label for="usePassword" style="text-transform: none; color: var(--text);">Enable AES Password Encryption</label>
      </div>

      <div class="control-group" id="encodePassContainer" style="display: none;">
        <label for="encodePassword">Secret Encryption Passphrase</label>
        <input type="password" id="encodePassword" placeholder="Enter encryption key..." />
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="generateQR" onchange="toggleQRContainer()" />
        <label for="generateQR" style="text-transform: none; color: var(--text);">Generate QR Code</label>
      </div>

      <div class="control-group">
        <label for="plainText">Plaintext Message</label>
        <textarea id="plainText" placeholder="Type your secret message here..."></textarea>
      </div>

      <div class="btn-group">
        <button onclick="handleEncode()">Encode Message</button>
        <button onclick="copyOutput('encodedOutput')">Copy Secret Message</button>
      </div>

      <div class="control-group">
        <label>Encoded Output <span id="modeBadge" class="info-badge">Alien Glyphs</span></label>
        <div id="encodedOutput" class="output-box">si</div>
      </div>

      <!-- OPTIONAL QR CODE CONTAINER -->
      <div class="qr-container" id="qrWrapper" style="display: none;">
        <label>Encoded QR Code</label>
        <div id="qrcode"></div>
      </div>
    </div>

    <!-- DECODER -->
    <div class="card">
      <h2>Decoder</h2>
      <div class="control-group">
        <label for="cipherText">Encoded Message</label>
        <textarea id="cipherText" placeholder="Paste encoded message starting with 'si'..."></textarea>
      </div>

      <div class="control-group">
        <label for="decodePassword">Passphrase (If message is encrypted)</label>
        <input type="password" id="decodePassword" placeholder="Enter passphrase..." />
      </div>

      <div class="btn-group">
        <button onclick="handleDecode()">Decode Message</button>
      </div>

      <div class="control-group">
        <label>Decoded Plaintext</label>
        <div id="decodedOutput" class="output-box"></div>
      </div>
    </div>
  </div>

  <script>
    const PREFIX = "si";
    const SECRET_SYMBOL = " ‎‎‎‎‎"; 

    // Symbol Maps for all supported ciphers
    const SYMBOLS = {
      invisible: { bit0: "\u200b", bit1: "\u200c" },
      visible:   { bit0: "⬡",      bit1: "⬢" },
      lunar:     { bit0: "🌑",     bit1: "🌕" },
      matrix:    { bit0: "░",      bit1: "▓" },
      runic:     { bit0: "ᚢ",      bit1: "ᛏ" },
      cards:     { bit0: "♢",      bit1: "♦" },
      music:     { bit0: "♩",      bit1: "♬" },
      zodiac:    { bit0: "♈",      bit1: "♏" }
    };

    document.getElementById("encodeMode").addEventListener("change", (e) => {
      const badge = document.getElementById("modeBadge");
      const labels = {
        visible: "Alien Glyphs",
        lunar: "Lunar Phases",
        matrix: "Cyber Blocks",
        runic: "Runic Magic",
        cards: "Card Suits",
        music: "Music Notes",
        zodiac: "Zodiac Signs",
        invisible: "Invisible Payload"
      };
      badge.textContent = labels[e.target.value] || "Cipher Selected";
    });

    function togglePasswordFields() {
      const usePass = document.getElementById("usePassword").checked;
      document.getElementById("encodePassContainer").style.display = usePass ? "flex" : "none";
    }

    function toggleQRContainer() {
      const showQR = document.getElementById("generateQR").checked;
      const qrWrapper = document.getElementById("qrWrapper");
      if (!showQR) {
        qrWrapper.style.display = "none";
      } else {
        const outputText = document.getElementById("encodedOutput").textContent;
        if (outputText && outputText !== PREFIX) {
          renderQRCode(outputText);
        }
      }
    }

    function renderQRCode(text) {
      const qrWrapper = document.getElementById("qrWrapper");
      const qrcodeContainer = document.getElementById("qrcode");
      qrcodeContainer.innerHTML = "";
      new QRCode(qrcodeContainer, {
        text: text,
        width: 180,
        height: 180,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
      qrWrapper.style.display = "flex";
    }

    // Web Crypto API Key Derivation
    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // AES-GCM Encryption
    async function encryptPayload(text, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getCryptoKey(password, salt);
      const encodedText = new TextEncoder().encode(text);
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv }, key, encodedText
      );

      // Return combined Salt (16B) + IV (12B) + Ciphertext
      const combined = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(ciphertext), salt.length + iv.length);
      return combined;
    }

    // AES-GCM Decryption
    async function decryptPayload(combinedBytes, password) {
      if (combinedBytes.length < 28) throw new Error("Payload too short");
      const salt = combinedBytes.slice(0, 16);
      const iv = combinedBytes.slice(16, 28);
      const ciphertext = combinedBytes.slice(28);
      const key = await getCryptoKey(password, salt);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv }, key, ciphertext
      );
      return new TextDecoder().decode(decrypted);
    }

    async function handleEncode() {
      const text = document.getElementById("plainText").value;
      const mode = document.getElementById("encodeMode").value;
      const usePass = document.getElementById("usePassword").checked;
      const password = document.getElementById("encodePassword").value;
      const outputEl = document.getElementById("encodedOutput");

      if (!text) {
        outputEl.textContent = PREFIX + SECRET_SYMBOL;
        document.getElementById("qrWrapper").style.display = "none";
        return;
      }

      if (usePass && !password) {
        alert("Please enter a passphrase for encryption!");
        return;
      }

      const { bit0, bit1 } = SYMBOLS[mode] || SYMBOLS.visible;

      try {
        let bytes;
        let isEncryptedFlag = usePass ? "1" : "0";

        if (usePass) {
          bytes = await encryptPayload(text, password);
        } else {
          bytes = new TextEncoder().encode(text);
        }

        // Build Payload: Header Flag Bit (1=Encrypted, 0=Plain) + Byte Bitstream
        let bitStream = isEncryptedFlag === "1" ? bit1 : bit0;

        for (let byte of bytes) {
          const bits = byte.toString(2).padStart(8, '0');
          for (let bit of bits) {
            bitStream += (bit === '1' ? bit1 : bit0);
          }
        }

        const result = PREFIX + bitStream + SECRET_SYMBOL;
        outputEl.textContent = result;

        if (document.getElementById("generateQR").checked) {
          renderQRCode(result);
        } else {
          document.getElementById("qrWrapper").style.display = "none";
        }
      } catch (err) {
        alert("Error encoding message: " + err.message);
      }
    }

    async function handleDecode() {
      const input = document.getElementById("cipherText").value;
      const password = document.getElementById("decodePassword").value;
      const outputEl = document.getElementById("decodedOutput");

      outputEl.classList.remove("error");

      if (!input.startsWith(PREFIX)) {
        outputEl.textContent = "Error: Invalid message format. Must start with 'si'.";
        outputEl.classList.add("error");
        return;
      }

      const payload = input.slice(PREFIX.length);
      let bitString = "";

      // Extract all valid 0/1 bits across all supported symbol sets
      for (let char of payload) {
        if (Object.values(SYMBOLS).some(s => s.bit1 === char)) {
          bitString += "1";
        } else if (Object.values(SYMBOLS).some(s => s.bit0 === char)) {
          bitString += "0";
        }
      }

      if (bitString.length < 9 || (bitString.length - 1) % 8 !== 0) {
        outputEl.textContent = "Error: Invalid or corrupted payload.";
        outputEl.classList.add("error");
        return;
      }

      const isEncrypted = bitString[0] === "1";
      const payloadBits = bitString.slice(1);

      // Convert bit stream to Uint8Array bytes
      const bytes = new Uint8Array(payloadBits.length / 8);
      for (let i = 0; i < payloadBits.length; i += 8) {
        bytes[i / 8] = parseInt(payloadBits.slice(i, i + 8), 2);
      }

      try {
        if (isEncrypted) {
          if (!password) {
            outputEl.textContent = "Error: Password required. This message is encrypted.";
            outputEl.classList.add("error");
            return;
          }
          const decryptedText = await decryptPayload(bytes, password);
          outputEl.textContent = decryptedText;
        } else {
          outputEl.textContent = new TextDecoder().decode(bytes);
        }
      } catch (err) {
        outputEl.textContent = "Error: Decryption failed. Incorrect password or corrupted payload.";
        outputEl.classList.add("error");
      }
    }

    function copyOutput(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Secret message copied to clipboard!");
      });
    }
  </script>
</body>
</html>
