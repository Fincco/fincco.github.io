        for (const ic of this.icicles) {
          ic.update(this.arena);
          if (ic.state === 'falling' || ic.state === 'shaking') {
            for (const p of this.players) {
              if (!p.active || p.state !== 'alive') continue;
              if (
                p.x + p.width - 3 > ic.x + 1 &&
                p.x + 3 < ic.x + 7 &&
                p.y + p.height - 2 > ic.y &&
                p.y + 2 < ic.y + 10
              ) {
                p.die();
              }
            }
          }
        }

        // 7. Update Floating Popups & Water Splashes
        for (const pop of this.popups) {
          pop.y -= 0.45;
          pop.life--;
        }
        this.popups = this.popups.filter(p => p.life > 0);

        for (const sp of this.splashes) {
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vy += 0.2;
          sp.life--;
        }
        this.splashes = this.splashes.filter(s => s.life > 0);

        // 8. Check Bonus Phase or Standard Phase Completion
        if (this.isBonusPhase) {
          this.bonusTimer--;
          if (this.coins.length === 0 || this.bonusTimer <= 0) {
            if (this.coins.length === 0) {
              this.mario.addScore(3000);
              if (this.luigi.active) this.luigi.addScore(3000);
              this.addPopup(96, 112, 'PERFECT 3000!', '#ffe600');
            }
            this.state = 'phase_clear';
            this.stateTimer = 110;
            sfx.phaseClear();
          }
        } else {
          const activeHostiles = this.enemies.filter(e => e.type !== 'freezie');
          if (this.spawnQueue.length === 0 && activeHostiles.length === 0) {
            this.state = 'phase_clear';
            this.stateTimer = 95;
            sfx.phaseClear();
          }
        }

        // 9. Check Game Over Condition
        const marioOut = !this.mario.active || this.mario.state === 'dead_out';
        const luigiOut = !this.luigi.active || this.luigi.state === 'dead_out';
        if (marioOut && luigiOut) {
          this.state = 'gameover';
          sfx.gameOver();
        }
      }

      /************************************************************************
       * RENDERING HUD, ARENA, ENTITIES & ARCADE OVERLAYS
       ************************************************************************/
      drawHUD() {
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.textBaseline = 'top';

        // 1P Score (Mario)
        ctx.fillStyle = '#ff3820';
        ctx.fillText('I-', 8, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(this.mario.score).padStart(6, '0'), 23, 6);

        // Mario Lives Icons
        if (this.infiniteLives) {
          ctx.fillStyle = '#ff3820';
          ctx.fillRect(8, 16, 5, 5);
          ctx.fillStyle = '#ffb850';
          ctx.fillRect(9, 18, 3, 2);
          ctx.fillStyle = '#ffe600';
          ctx.fillText('INF', 16, 15);
        } else {
          for (let i = 0; i < Math.min(5, this.mario.lives); i++) {
            ctx.fillStyle = '#ff3820';
            ctx.fillRect(8 + i * 7, 16, 5, 5);
            ctx.fillStyle = '#ffb850';
            ctx.fillRect(9 + i * 7, 18, 3, 2);
          }
        }

        // TOP Score
        ctx.fillStyle = '#ff9838';
        ctx.fillText('TOP-', 86, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(this.topScore).padStart(6, '0'), 115, 6);

        // 2P Score (Luigi)
        if (this.twoPlayerMode) {
          ctx.fillStyle = '#00d848';
          ctx.fillText('II-', 176, 6);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(String(this.luigi.score).padStart(6, '0'), 197, 6);

          if (this.infiniteLives) {
            ctx.fillStyle = '#00d848';
            ctx.fillRect(197, 16, 5, 5);
            ctx.fillStyle = '#ffb850';
            ctx.fillRect(198, 18, 3, 2);
            ctx.fillStyle = '#ffe600';
            ctx.fillText('INF', 205, 15);
          } else {
            for (let i = 0; i < Math.min(5, this.luigi.lives); i++) {
              ctx.fillStyle = '#00d848';
              ctx.fillRect(197 + i * 7, 16, 5, 5);
              ctx.fillStyle = '#ffb850';
              ctx.fillRect(198 + i * 7, 18, 3, 2);
            }
          }
        }

        // Phase Counter at Bottom Left
        ctx.fillStyle = '#40d8ff';
        ctx.fillText(`P=${String(this.phase).padStart(2, '0')}`, 8, 224);

        // Bonus Stage Countdown Timer
        if (this.isBonusPhase && this.state === 'playing') {
          const secs = (this.bonusTimer / 60).toFixed(1);
          ctx.fillStyle = '#ffe030';
          ctx.fillText(`TIME ${secs}`, 92, 20);
        }
      }

      drawTitleScreen() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        this.drawHUD();

        // Classic 1983 Brick Frame Marquee
        ctx.fillStyle = '#d82800';
        ctx.fillRect(28, 34, 200, 54);
        ctx.fillStyle = '#ff9838';
        ctx.fillRect(31, 37, 194, 48);
        ctx.fillStyle = '#000000';
        ctx.fillRect(34, 40, 188, 42);

        ctx.font = '14px "Press Start 2P", monospace';
        ctx.fillStyle = '#ff3820';
        ctx.fillText('MARIO BROS.', 51, 50);
        ctx.fillStyle = '#ffe030';
        ctx.fillText('MARIO BROS.', 49, 48);

        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillStyle = '#48d8ff';
        ctx.fillText('1983 NINTENDO ARCADE EDITION', 44, 69);

        // Animated Cast Showcase
        const step = Math.floor(this.frameCount / 12) % 2 === 0;
        drawPixelMatrix(step ? SPRITES.playerRun1 : SPRITES.playerStand, 42, 98, PALETTES.mario, false, false);
        drawPixelMatrix(step ? SPRITES.playerRun2 : SPRITES.playerStand, 198, 98, PALETTES.luigi, true, false);

        // Enemy Cast Legend
        drawPixelMatrix(step ? SPRITES.turtle1 : SPRITES.turtle2, 52, 124, PALETTES.turtleNormal, false, false);
        ctx.fillStyle = '#00d848';
        ctx.fillText('SHELLCREEPER (1 BUMP)', 76, 128);

        drawPixelMatrix(step ? SPRITES.crab1 : SPRITES.crab2, 52, 142, PALETTES.crabNormal, false, false);
        ctx.fillStyle = '#ff6868';
        ctx.fillText('SIDESTEPPER  (2 BUMPS)', 76, 145);

        drawPixelMatrix(step ? SPRITES.fly1 : SPRITES.fly2, 52, 160, PALETTES.flyNormal, false, false);
        ctx.fillStyle = '#ff68d8';
        ctx.fillText('FIGHTERFLY   (HOPPER)', 76, 163);

        drawPixelMatrix(SPRITES.freezie, 52, 178, PALETTES.freezie, false, false);
        ctx.fillStyle = '#48e8ff';
        ctx.fillText('SLIPICE      (FREEZER)', 76, 181);

        // Flashing Start Prompt
        if (Math.floor(this.frameCount / 25) % 2 === 0) {
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffe600';
          ctx.fillText('PRESS [ENTER] OR [1P/2P]', 44, 204);
        }

        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('1: 1-PLAYER MARIO   2: 2-PLAYER CO-OP', 18, 222);
      }

      draw() {
        if (this.pacmanMode) {
          this.pacGame.draw(this.frameCount);
          if (this.paused) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(76, 102, 104, 28);
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = '#ffe600';
            ctx.fillText('PAUSED', 104, 112);
          }
          return;
        }

        if (this.state === 'title') {
          this.drawTitleScreen();
          return;
        }

        // Clear Background
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // 1. Arena Platforms, POW Block, Floor & Water
        this.arena.draw(this.frameCount);

        // 2. HUD
        this.drawHUD();

        // 3. Coins
        for (const c of this.coins) c.draw(this.frameCount);

        // 4. Enemies
        for (const e of this.enemies) e.draw(this.frameCount);

        // 5. Fireballs & Icicles
        for (const fb of this.fireballs) fb.draw(this.frameCount);
        for (const ic of this.icicles) ic.draw(this.frameCount);

        // 6. Players
        for (const p of this.players) p.draw(this.frameCount);

        // 7. Foreground Pipes (drawn over emerging/entering enemies for authentic occlusion)
        this.arena.drawPipes();

        // 8. Water Splashes & Score Popups
        ctx.fillStyle = '#ffffff';
        for (const sp of this.splashes) {
          ctx.fillRect(Math.round(sp.x), Math.round(sp.y), 2, 2);
        }

        ctx.font = '6px "Press Start 2P", monospace';
        for (const pop of this.popups) {
          ctx.fillStyle = pop.color;
          ctx.fillText(pop.text, Math.round(pop.x), Math.round(pop.y));
        }

        // 9. Phase Banner Overlays
        if (this.state === 'phase_intro') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.84)';
          ctx.fillRect(34, 88, 188, 48);
          ctx.strokeStyle = '#38d8ff';
          ctx.strokeRect(34, 88, 188, 48);

          ctx.font = '8px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffe600';
          ctx.fillText(`PHASE ${String(this.phase).padStart(2, '0')}`, 94, 96);

          ctx.font = '6px "Press Start 2P", monospace';
          ctx.fillStyle = '#48d8ff';
          ctx.fillText(this.arena.meta.name, 52, 110);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(this.arena.meta.subtitle, 46, 122);
        }

        if (this.state === 'phase_clear') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
          ctx.fillRect(54, 98, 148, 34);
          ctx.font = '8px "Press Start 2P", monospace';
          ctx.fillStyle = '#00ff68';
          ctx.fillText('PHASE CLEAR!', 80, 111);
        }

        if (this.state === 'gameover') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.fillRect(44, 88, 168, 56);
          ctx.strokeStyle = '#ff3820';
          ctx.strokeRect(44, 88, 168, 56);

          ctx.font = '10px "Press Start 2P", monospace';
          ctx.fillStyle = '#ff3820';
          ctx.fillText('GAME OVER', 83, 100);

          ctx.font = '6px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffe600';
          ctx.fillText('PRESS [ENTER] TO PLAY AGAIN', 49, 122);
        }

        if (this.paused) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.fillRect(76, 102, 104, 28);
          ctx.font = '8px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffe600';
          ctx.fillText('PAUSED', 104, 112);
        }
      }
    }

    const game = new MarioBrosArcade();

    /**************************************************************************
     * UI BUTTONS & MOBILE TOUCH BINDINGS
     **************************************************************************/
    document.getElementById('btnMode1P').addEventListener('click', () => {
      game.paused = false;
      game.startNewGame(false);
    });

    document.getElementById('btnMode2P').addEventListener('click', () => {
      game.paused = false;
      game.startNewGame(true);
    });

    document.getElementById('arenaSelect').addEventListener('change', (e) => {
      const targetPhase = parseInt(e.target.value, 10) || 1;
      sfx.init();
      game.paused = false;
      if (game.state === 'title' || game.state === 'gameover') {
        game.startNewGame(game.twoPlayerMode, targetPhase);
      } else {
        game.setupPhase(targetPhase, targetPhase === 3, true);
      }
      e.target.blur();
    });

    document.getElementById('btnNextPhase').addEventListener('click', () => {
      sfx.init();
      game.paused = false;
      if (game.state === 'title' || game.state === 'gameover') {
        game.startNewGame(game.twoPlayerMode);
      } else {
        game.setupPhase(game.phase + 1);
      }
    });

    document.getElementById('btnCheatBoost').addEventListener('click', () => {
      sfx.init();
      game.arena.powHitsLeft = 3;
      game.mario.lives = Math.min(9, game.mario.lives + 1);
      if (game.luigi.active) {
        game.luigi.lives = Math.min(9, game.luigi.lives + 1);
      }
      sfx.coin();
      game.addPopup(88, 148, 'POW+1UP!', '#ffe600');
    });

    document.getElementById('btnCheatPacman').addEventListener('click', () => {
      game.togglePacmanMode();
    });

    function toggleFullPageMode(forceState) {
      const btn = document.getElementById('btnFullPage');
      const isNowFull = typeof forceState === 'boolean'
        ? forceState
        : !document.body.classList.contains('page-fullscreen');

      document.body.classList.toggle('page-fullscreen', isNowFull);
      if (btn) {
        btn.textContent = isNowFull ? 'EXIT FULL PAGE' : 'FULL PAGE';
        btn.classList.toggle('bg-purple-600', !isNowFull);
        btn.classList.toggle('hover:bg-purple-500', !isNowFull);
        btn.classList.toggle('bg-rose-600', isNowFull);
        btn.classList.toggle('hover:bg-rose-500', isNowFull);
      }
    }

    document.getElementById('btnFullPage').addEventListener('click', () => {
      toggleFullPageMode();
    });

    document.getElementById('btnPause').addEventListener('click', (e) => {
      if (game.state === 'playing') {
        game.paused = !game.paused;
        e.currentTarget.textContent = game.paused ? 'RESUME' : 'PAUSE';
      }
    });

    document.getElementById('btnAudio').addEventListener('click', (e) => {
      const on = sfx.toggle();
      e.currentTarget.textContent = on ? 'SFX:ON' : 'SFX:OFF';
    });

    document.getElementById('btnCRT').addEventListener('click', () => {
      document.getElementById('crtScreen').classList.toggle('crt-scanlines');
    });

    function bindTouchHold(btnId, field) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      const setVal = (val) => {
        game.touchInput[field] = val;
        btn.classList.toggle('active-touch', val);
      };
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); setVal(true); }, { passive: false });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); setVal(false); }, { passive: false });
      btn.addEventListener('mousedown', () => setVal(true));
      btn.addEventListener('mouseup', () => setVal(false));
      btn.addEventListener('mouseleave', () => setVal(false));
    }

    bindTouchHold('touchLeft', 'left');
    bindTouchHold('touchRight', 'right');
    bindTouchHold('touchJump', 'jump');

    document.getElementById('touchStart').addEventListener('click', () => {
      game.startNewGame(game.twoPlayerMode);
    });

    // Main 60FPS Game Loop started on window load
    window.onload = function () {
      function gameLoop() {
        game.update();
        game.draw();
        requestAnimationFrame(gameLoop);
      }
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
